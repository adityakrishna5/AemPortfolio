<!--/*
  travel-footer.html
  Renders the React mount point for TravelFooter.
*/-->
<div data-sly-use.model="com.adkstvite.core.models.travel.TravelFooterModel"
     id="travel-footer"
     data-brand-name="${model.brandName @ context='attribute'}"
     data-brand-href="${model.brandHref @ context='attribute'}"
     data-tagline="${model.tagline @ context='attribute'}"
     data-quick-links="${model.quickLinksJson @ context='attribute'}"
     data-top-destinations="${model.topDestinationsJson @ context='attribute'}"
     data-quick-links-heading="${model.quickLinksHeading @ context='attribute'}"
     data-top-destinations-heading="${model.topDestinationsHeading @ context='attribute'}"
     data-newsletter-heading="${model.newsletterHeading @ context='attribute'}"
     data-newsletter-description="${model.newsletterDescription @ context='attribute'}"
     data-newsletter-button-label="${model.newsletterButtonLabel @ context='attribute'}">
</div>
