<!--/*
  travel-about.html
  Renders the React mount point for TravelAbout.
*/-->
<div data-sly-use.model="com.adkstvite.core.models.travel.TravelAboutModel"
     id="travel-about"
     data-about-image="${model.aboutImage @ context='attribute'}"
     data-overline="${model.overline @ context='attribute'}"
     data-headline="${model.headline @ context='attribute'}"
     data-headline-accent="${model.headlineAccent @ context='attribute'}"
     data-para1="${model.para1 @ context='attribute'}"
     data-para2="${model.para2 @ context='attribute'}"
     data-stat1-value="${model.stat1Value @ context='attribute'}"
     data-stat1-label="${model.stat1Label @ context='attribute'}"
     data-stat2-value="${model.stat2Value @ context='attribute'}"
     data-stat2-label="${model.stat2Label @ context='attribute'}"
     data-stat3-value="${model.stat3Value @ context='attribute'}"
     data-stat3-label="${model.stat3Label @ context='attribute'}"
     data-stat4-value="${model.stat4Value @ context='attribute'}"
     data-stat4-label="${model.stat4Label @ context='attribute'}"
     data-cta-label="${model.ctaLabel @ context='attribute'}"
     data-cta-href="${model.ctaHref @ context='attribute'}">
</div>
